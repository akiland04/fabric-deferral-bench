counts:
  images: 94833
  normal: 71127
  defective: 23706
  xml_annotations: 94833
  masks: 23706
  bounding_boxes: 35675
  patterns: 19
  groups: 5

official_split:
  train: {normal: 47423, defective: 15761}
  test: {normal: 23704, defective: 7945}

format:
  images: JPEG 512x512; groups 1-4 RGB, group 5 greyscale
  masks: PNG 512x512 greyscale, one per defective image
  annotations: one XML per image (pattern, group, defective flag, mask file, 0..n bounding boxes)

labels: binary only (<defective> 0/1); the release has no defect class field
label_mapping: {defect: "defective = 1", normal: "defective = 0"}

