# Shared settings. Machine-specific paths go in config.local.yaml (not committed).
seed: 42

# Risk budget grid (D3). Fixed before any experiment runs.
risk_budgets: [0.005, 0.01, 0.02, 0.05]

datasets:
  zju_leaper:
    dir: ZJU-Leaper
    images: Images
    annotations: Annotations/xmls
    masks: Annotations/masks
    official_splits: ImageSets/total.json
  tsfabrics:
    dir: TSfabrics
    images: IMAGE
    masks: ANNOTATION
    labels: CSV

outputs_dir: runs
derived_dir: derived # generated data, relative to data_root (never inside the raw dataset)

# Validation and calibration are carved from ZJU-Leaper's official train split (D3).
splits:
  zju_leaper:
    val_frac: 0.10
    cal_frac: 0.10

# Smoke run (T20): a small stratified sample of each split, to test the pipeline end to end.
smoke:
  zju_leaper:
    train: 300
    val: 100
    cal: 100
    test: 100

# YOLO training profiles (T20b smoke; T27 adds `full`). Run: python scripts/train_yolo.py --profile smoke
train:
  smoke:
    model: yolo11n.pt   # nano, COCO-pretrained: fine-tune, don't train from scratch
    data: smoke         # which data.yaml: smoke -> <layout>/smoke/data.yaml, full -> <layout>/data.yaml
    epochs: 10          # tracker says 1; 10 gives non-trivial scores for T21-T31 and is still minutes
    imgsz: 512          # ZJU's native size; YOLO's default 640 would upscale every image
    batch: 8            # safe for 8 GB of shared memory
    workers: 0          # load images in the main process; avoids data-loader stalls on macOS
    device: mps         # Apple GPU
  full:
    model: yolo11s.pt     # small, COCO-pretrained: a standard baseline (the research is the threshold, not the detector)
    data: full            # <layout>/data.yaml: all 50,550 train images, 6,317 val
    epochs: 100           # upper limit; T27b sets the final number from a timing run and the Kaggle budget
    patience: 20          # stop early if val has not improved for 20 epochs; best.pt = best epoch on val
    imgsz: 512            # native ZJU size, same as smoke and inference
    batch: 32             # fixed, not 'auto', so the run does not depend on which GPU Kaggle assigns
    optimizer: SGD        # explicit: 'auto' picks the optimizer by run length (smoke got AdamW)
    lr0: 0.01             # standard starting learning rate for SGD
    fliplr: 0.5           # left-right flips (Ultralytics default, stated for the record)
    flipud: 0.5           # up-down flips: fabric has no 'up', so a flipped defect is still a defect (default 0.0)
    hsv_h: 0.015          # colour/brightness jitter at Ultralytics defaults, chosen from ZJU only
    hsv_s: 0.7
    hsv_v: 0.4
    mosaic: 1.0           # default: stitch 4 images into one training image
    close_mosaic: 10      # default: no mosaic in the last 10 epochs
    amp: true             # mixed precision: faster on Kaggle's NVIDIA GPU (not available on the Mac)
    save_period: 5        # save a checkpoint every 5 epochs, so a Kaggle cut-off loses at most 5
    workers: 4            # Kaggle has 4 CPU cores
    device: 0             # the first NVIDIA GPU
    # Augmentations not listed stay at Ultralytics 8.4.171 defaults; every value used is saved in <run>/args.yaml.

# Inference (T20c). `conf` is part of the frame score s(x): it must stay identical for cal, test and target data.
predict:
  conf: 0.001     # keep weak boxes so s(x) is informative; YOLO's default 0.25 would hide them
  iou: 0.7        # NMS overlap, same as validation during training
  imgsz: 512      # same as training
  max_det: 300    # cap on boxes per image (revisit for the full test set at T30)
  device: mps
