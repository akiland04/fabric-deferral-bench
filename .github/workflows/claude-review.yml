name: claude-review

on:
  pull_request:
    branches: [develop, pre-develop]
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    # Skip promotion (pre-develop → develop) and back-merge PRs: that code was already reviewed
    if: github.head_ref != 'pre-develop' && github.head_ref != 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write          # lets the action sign in as the Claude GitHub App
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1       # gives Claude a copy of the repo to read
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'